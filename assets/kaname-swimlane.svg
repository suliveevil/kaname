<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 1650" width="680" height="1650" role="img">
<title>Kaname 用户与 app 交互流程总图：主链路 16 步与旁路 7 条</title>
<desc>三个区块垂直排列：主链路 A 泳道图（步 1 到 8）、主链路 B 泳道图（步 9 到 16）、旁路分叉示意图（B1 到 B7）。六条角色泳道为用户、前台 App、macOS 系统、Kaname 触发、Kaname 引擎、Kaname 界面。</desc>
<style>
.kbg{fill:#f1efe8;fill-opacity:.35;stroke:#b4b2a9;stroke-width:.5}
.kbgk{fill:#e6f1fb;fill-opacity:.4;stroke:#b5d4f4;stroke-width:.5}
.khd{fill:#d3d1c7;fill-opacity:.8}
.khdk{fill:#b5d4f4;fill-opacity:.8}
.klb{font-size:11px;font-weight:500;fill:#2c2c2a;text-anchor:middle;dominant-baseline:central}
.knx{fill:#f1efe8;stroke:#5f5e5a;stroke-width:.5}
.knk{fill:#e6f1fb;stroke:#185fa5;stroke-width:.5}
.ktx{font-size:12px;font-weight:500;fill:#444441;text-anchor:middle;dominant-baseline:central}
.ktk{font-size:12px;font-weight:500;fill:#0c447c;text-anchor:middle;dominant-baseline:central}
.ksx{font-size:11px;font-weight:400;fill:#5f5e5a;text-anchor:middle;dominant-baseline:central}
.ksk{font-size:11px;font-weight:400;fill:#185fa5;text-anchor:middle;dominant-baseline:central}
.kar{fill:none;stroke:#5f5e5a;stroke-width:1}
.kbar{fill:#eef1f5;stroke:#d8dce2;stroke-width:.5}
.kh1{font-size:13px;font-weight:500;fill:#1f2328;text-anchor:start;dominant-baseline:central}
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect x="0" y="0" width="680" height="1650" fill="#ffffff"/>
<rect class="kbar" x="40" y="8" width="600" height="26"/><text class="kh1" x="52" y="21">一 · 主链路 A：启动到面板出现（步 1–8）</text>
<g>
<g class="kbg"><rect x="40" y="40" width="100" height="512"/><rect x="140" y="40" width="100" height="512"/><rect x="240" y="40" width="100" height="512"/></g>
<g class="kbgk"><rect x="340" y="40" width="100" height="512"/><rect x="440" y="40" width="100" height="512"/><rect x="540" y="40" width="100" height="512"/></g>
<rect class="khd" x="40" y="40" width="100" height="36"/><rect class="khd" x="140" y="40" width="100" height="36"/><rect class="khd" x="240" y="40" width="100" height="36"/>
<rect class="khdk" x="340" y="40" width="100" height="36"/><rect class="khdk" x="440" y="40" width="100" height="36"/><rect class="khdk" x="540" y="40" width="100" height="36"/>
<text class="klb" x="90" y="58">用户</text><text class="klb" x="190" y="58">前台 App</text><text class="klb" x="290" y="58">macOS 系统</text><text class="klb" x="390" y="58">Kaname 触发</text><text class="klb" x="490" y="58">Kaname 引擎</text><text class="klb" x="590" y="58">Kaname 界面</text>
<rect class="knx" x="46" y="88" width="88" height="44" rx="8"/><text class="ktx" x="90" y="103">1 启动应用</text><text class="ksx" x="90" y="117">菜单栏常驻</text>
<rect class="knx" x="246" y="148" width="88" height="44" rx="8"/><text class="ktx" x="290" y="163">2 权限就绪</text><text class="ksx" x="290" y="177">缺则权限向导</text>
<rect class="knx" x="146" y="208" width="88" height="44" rx="8"/><text class="ktx" x="190" y="223">3 前台 App</text><text class="ksx" x="190" y="237">菜单栏数据源</text>
<rect class="knk" x="446" y="268" width="88" height="44" rx="8"/><text class="ktk" x="490" y="283">4 扫描菜单</text><text class="ksk" x="490" y="297">三源合并缓存</text>
<rect class="knx" x="46" y="328" width="88" height="44" rx="8"/><text class="ktx" x="90" y="343">5 触发面板</text><text class="ksx" x="90" y="357">手势或热键</text>
<rect class="knk" x="346" y="388" width="88" height="44" rx="8"/><text class="ktk" x="390" y="403">6 捕获按键</text><text class="ksk" x="390" y="417">热键匹配</text>
<rect class="knk" x="446" y="448" width="88" height="44" rx="8"/><text class="ktk" x="490" y="463">7 组装列表</text><text class="ksk" x="490" y="477">三分区排序</text>
<rect class="knk" x="546" y="508" width="88" height="44" rx="8"/><text class="ktk" x="590" y="523">8 浮层面板</text><text class="ksk" x="590" y="537">持久覆盖前台</text>
<g class="kar" marker-end="url(#arrow)">
<path d="M 90 132 V 140 H 290 V 148"/><path d="M 290 192 V 200 H 190 V 208"/><path d="M 190 252 V 260 H 490 V 268"/><path d="M 490 312 V 320 H 90 V 328"/><path d="M 90 372 V 380 H 390 V 388"/><path d="M 390 432 V 440 H 490 V 448"/><path d="M 490 492 V 500 H 590 V 508"/>
</g>
</g>
<rect class="kbar" x="40" y="578" width="600" height="26"/><text class="kh1" x="52" y="591">二 · 主链路 B：筛选到执行收尾（步 9–16）</text>
<g transform="translate(0,600)">
<g class="kbg"><rect x="40" y="40" width="100" height="512"/><rect x="140" y="40" width="100" height="512"/><rect x="240" y="40" width="100" height="512"/></g>
<g class="kbgk"><rect x="340" y="40" width="100" height="512"/><rect x="440" y="40" width="100" height="512"/><rect x="540" y="40" width="100" height="512"/></g>
<rect class="khd" x="40" y="40" width="100" height="36"/><rect class="khd" x="140" y="40" width="100" height="36"/><rect class="khd" x="240" y="40" width="100" height="36"/>
<rect class="khdk" x="340" y="40" width="100" height="36"/><rect class="khdk" x="440" y="40" width="100" height="36"/><rect class="khdk" x="540" y="40" width="100" height="36"/>
<text class="klb" x="90" y="58">用户</text><text class="klb" x="190" y="58">前台 App</text><text class="klb" x="290" y="58">macOS 系统</text><text class="klb" x="390" y="58">Kaname 触发</text><text class="klb" x="490" y="58">Kaname 引擎</text><text class="klb" x="590" y="58">Kaname 界面</text>
<rect class="knx" x="46" y="88" width="88" height="44" rx="8"/><text class="ktx" x="90" y="103">9 筛选导航</text><text class="ksx" x="90" y="117">修饰键+字母</text>
<rect class="knk" x="346" y="148" width="88" height="44" rx="8"/><text class="ktk" x="390" y="163">10 筛选队列</text><text class="ksk" x="390" y="177">导航键消费</text>
<rect class="knk" x="546" y="208" width="88" height="44" rx="8"/><text class="ktk" x="590" y="223">11 列表收窄</text><text class="ksk" x="590" y="237">无匹配不关</text>
<rect class="knx" x="46" y="268" width="88" height="44" rx="8"/><text class="ktx" x="90" y="283">12 执行复制</text><text class="ksx" x="90" y="297">Space 执行</text>
<rect class="knk" x="446" y="328" width="88" height="44" rx="8"/><text class="ktk" x="490" y="343">13 按压优先</text><text class="ksk" x="490" y="357">失败才注入</text>
<rect class="knx" x="246" y="388" width="88" height="44" rx="8"/><text class="ktx" x="290" y="403">14 系统落地</text><text class="ksx" x="290" y="417">注入或剪贴板</text>
<rect class="knx" x="146" y="448" width="88" height="44" rx="8"/><text class="ktx" x="190" y="463">15 菜单生效</text><text class="ksx" x="190" y="477">像面板没开</text>
<rect class="knk" x="546" y="508" width="88" height="44" rx="8"/><text class="ktk" x="590" y="523">16 面板关闭</text><text class="ksk" x="590" y="537">统计落盘</text>
<g class="kar" marker-end="url(#arrow)">
<path d="M 90 132 V 140 H 390 V 148"/><path d="M 390 192 V 200 H 590 V 208"/><path d="M 590 252 V 260 H 90 V 268"/><path d="M 90 312 V 320 H 490 V 328"/><path d="M 490 372 V 380 H 290 V 388"/><path d="M 290 432 V 440 H 190 V 448"/><path d="M 190 492 V 500 H 590 V 508"/>
</g>
</g>
<rect class="kbar" x="40" y="1178" width="600" height="26"/><text class="kh1" x="52" y="1191">三 · 旁路：七条分叉（B1–B7）</text>
<g transform="translate(0,1200)">
<rect class="khd" x="40" y="16" width="130" height="28"/><text class="klb" x="105" y="30">分叉点</text>
<rect class="khdk" x="220" y="16" width="420" height="28"/><text class="klb" x="430" y="30">旁路 B1–B7 · 参与角色与结果</text>
<rect class="knx" x="40" y="60" width="130" height="44" rx="8"/><text class="ktx" x="105" y="82">步 1 · 启动</text>
<rect class="knk" x="220" y="60" width="420" height="44" rx="8"/><text class="ktk" x="430" y="76">B1 菜单栏与设置</text><text class="ksk" x="430" y="92">用户 → 界面 → 引擎 · 七页设置，两套触发都关＝暂停</text>
<rect class="knx" x="40" y="114" width="130" height="44" rx="8"/><text class="ktx" x="105" y="136">步 2 · 授权</text>
<rect class="knk" x="220" y="114" width="420" height="44" rx="8"/><text class="ktk" x="430" y="130">B2 权限向导</text><text class="ksk" x="430" y="146">用户 → 界面 → macOS · 辅助功能不弹提示，输入监控才弹</text>
<rect class="knx" x="40" y="168" width="130" height="44" rx="8"/><text class="ktx" x="105" y="190">步 4 · 扫描</text>
<rect class="knk" x="220" y="168" width="420" height="44" rx="8"/><text class="ktk" x="430" y="184">B3 冲突检测与按键测试</text><text class="ksk" x="430" y="200">引擎 → 界面 → macOS · 按类型给胜负，双监听点判定</text>
<rect class="knx" x="40" y="222" width="130" height="44" rx="8"/><text class="ktx" x="105" y="244">步 5 · 触发</text>
<rect class="knk" x="220" y="222" width="420" height="44" rx="8"/><text class="ktk" x="430" y="238">B4 全局搜索面板</text><text class="ksk" x="430" y="254">用户 → 界面 → 前台 App · Return 先激活目标 App 再执行</text>
<rect class="knx" x="40" y="276" width="130" height="44" rx="8"/><text class="ktx" x="105" y="298">步 8 · 面板</text>
<rect class="knk" x="220" y="276" width="420" height="44" rx="8"/><text class="ktk" x="430" y="292">B5 Karabiner 让路</text><text class="ksk" x="430" y="308">界面 → 引擎 → macOS · 写 kaname_panel，规则仅在关闭时生效</text>
<rect class="knx" x="40" y="330" width="130" height="44" rx="8"/><text class="ktx" x="105" y="352">步 12 · 执行</text>
<rect class="knk" x="220" y="330" width="420" height="44" rx="8"/><text class="ktk" x="430" y="346">B6 受管动作</text><text class="ksk" x="430" y="362">用户 → 引擎 → 界面 · 六个动作永不执行，只允许复制</text>
<rect class="knx" x="40" y="384" width="130" height="44" rx="8"/><text class="ktx" x="105" y="406">步 16 · 关闭</text>
<rect class="knk" x="220" y="384" width="420" height="44" rx="8"/><text class="ktk" x="430" y="400">B7 三条退出路径</text><text class="ksk" x="430" y="416">用户／前台 App／macOS → 界面 · Esc、失焦、安全输入</text>
<g class="kar" marker-end="url(#arrow)">
<path d="M 172 82 H 218"/><path d="M 172 136 H 218"/><path d="M 172 190 H 218"/><path d="M 172 244 H 218"/><path d="M 172 298 H 218"/><path d="M 172 352 H 218"/><path d="M 172 406 H 218"/>
</g>
</g>
</svg>
